<!DOCTYPE html>
<html>
<head>
<title>She is Chosen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<header>
<h1>She is Chosen</h1>
<p class="verse">“She is clothed with strength and dignity.” — Proverbs 31:25</p>

<div id="verseOfDay"></div>
<div id="streak"></div>

<button onclick="showSection('profile')">👤 Profile</button>
<button onclick="showSection('discussion')">💬 Community</button>
<button onclick="showSection('bible')">📖 Bible</button>

</header>

<!-- LOGIN -->
<div id="loginScreen">
<h2>Welcome</h2>
<input id="firstName" placeholder="Name">
<input id="username" placeholder="Username">
<input id="password" placeholder="Password">
<input id="avatarURL" placeholder="Profile Picture URL">
<button onclick="login()">Enter</button>
</div>

<!-- HOME -->
<section id="home" class="section">
<h2>🌸 Welcome</h2>
<p>You are chosen, loved, and called 💖</p>
</section>

<!-- PROFILE -->
<section id="profile" class="section">
<h2>Your Profile</h2>
<img id="profilePic" width="80">
<p id="profileName"></p>
<div id="profilePosts"></div>
</section>

<!-- BIBLE -->
<section id="bible" class="section">
<div id="bookList"></div>
<div id="chapterList"></div>
<div id="verseList"></div>
</section>

<!-- DISCUSSION -->
<section id="discussion" class="section">

<input id="discussionInput" placeholder="Share something...">
<button onclick="postDiscussion()">Post</button>

<div id="discussionPosts"></div>

</section>

<!-- SEARCH USERS -->
<input id="userSearch" placeholder="Search users">
<button onclick="searchUsers()">Search</button>
<div id="userResults"></div>

<!-- THEMES -->
<div>
<button onclick="setTheme('light')">Light</button>
<button onclick="setTheme('dark')">Dark</button>
<button onclick="setTheme('sage')">Sage</button>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
<!-- JOURNAL -->
<section id="journal" class="section">
<textarea id="journalText"></textarea>
<button onclick="saveJournal()">Save</button>
<div id="journalEntries"></div>
</section>

<!-- NOTES -->
<section id="notesSection" class="section">
<textarea id="notes"></textarea>
<button onclick="saveNotes()">Save Notes</button>
</section>

<!-- MUSIC -->
<section id="music" class="section">
<input id="musicLink" placeholder="YouTube link">
<button onclick="addMusic()">Add</button>
<div id="musicList"></div>
</section>
