<!DOCTYPE html>
<html>
<head>
<title>She is Chosen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>She is Chosen</h1>

<div id="verseOfDay"></div>
<div id="streak"></div>

<div class="nav">
<button onclick="showSection('home')">🏠</button>
<button onclick="showSection('bible')">📖</button>
<button onclick="showSection('journal')">📝</button>
<button onclick="showSection('music')">🎧</button>
<button onclick="showSection('discussion')">💬</button>
<button onclick="showSection('profile')">👤</button>
<button onclick="deleteNotes()">Delete Notes 🗑️</button>
</div>

<div id="notifBell" onclick="showNotifications()">🔔</div>
<div id="notifications"></div>

</header>

<!-- LOGIN -->
<div id="loginScreen">
<input id="firstName" placeholder="Name">
<input id="username" placeholder="Username">
<input id="password" placeholder="Password">
<input type="file" id="avatarUpload">
<button onclick="login()">Login</button>
</div>

<!-- HOME -->
<section id="home" class="section">
<h2>Welcome 💖</h2>
</section>

<!-- BIBLE -->
<section id="bible" class="section">
<input id="searchInput" placeholder="Search Bible">
<button onclick="searchBible()">Search</button>

<div id="bookList"></div>
<div id="chapterList"></div>
<div id="verseList"></div>
</section>

<!-- JOURNAL -->
<section id="journal" class="section">
<textarea id="journalText"></textarea>
<button onclick="saveJournal()">Save</button>
<div id="journalEntries"></div>
</section>

<!-- NOTES -->
<section id="notesSection" class="section">
<textarea id="notes"></textarea>
<button onclick="saveNotes()">Save Notes</button>
</section>

<!-- MUSIC -->
<section id="music" class="section">
<input id="musicLink">
<button onclick="addMusic()">Add</button>
<div id="musicList"></div>
</section>

<!-- DISCUSSION -->
<section id="discussion" class="section">
<input id="discussionInput">
<button onclick="postDiscussion()">Post</button>
<div id="discussionPosts"></div>
</section>

<!-- PROFILE -->
<section id="profile" class="section">
<h2>Your Profile</h2>
<img id="profilePic" width="80">
<p id="profileName"></p>

<h3>Your Notes</h3>
<div id="profileNotes"></div>

<h3>Saved Verses</h3>
<div id="profileFavorites"></div>
</section>

<!-- THEMES -->
<div class="themes">
<button onclick="setTheme('pink')">💖</button>
<button onclick="setTheme('dark')">🌙</button>
<button onclick="setTheme('sage')">🌿</button>
<button onclick="setTheme('ocean')">🌊</button>
<button onclick="setTheme('sunset')">🌅</button>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<button onclick="showSection('home')">🏠</button>
<button onclick="showSection('bible')">📖</button>
<button onclick="showSection('journal')">📝</button>
<button onclick="showSection('discussion')">💬</button>
<button onclick="showSection('profile')">👤</button>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
